spring.application.name=musicplayer
server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/MusicPlayer}

jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

logging.file.name=log/logs.txt

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true