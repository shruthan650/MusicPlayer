<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Melodia - Listener</title>

<link rel="stylesheet" href="style.css">

<style>

    /* ==============================
       DASHBOARD
    ============================== */

    body {
        display: block;
        min-height: 100vh;
    }

    .dashboard {
        width: 100%;
        min-height: 100vh;
        padding-bottom: 130px;
    }


    /* ==============================
       NAVBAR
    ============================== */

    .navbar {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 5%;

        border-bottom: 1px solid rgba(255,255,255,0.08);

        background: rgba(8,8,13,0.85);

        backdrop-filter: blur(10px);

        position: sticky;
        top: 0;
        z-index: 100;
    }

    .nav-logo {
        display: flex;
        align-items: center;
        gap: 10px;

        font-size: 22px;
        font-weight: 700;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    .nav-logo span {
        color: #8b5cf6;
        font-size: 28px;
    }

    .nav-actions {
        display: flex;
        gap: 10px;
    }

    .nav-btn {
        border: none;
        background: transparent;
        color: #ddd;

        padding: 9px 14px;

        border-radius: 10px;

        cursor: pointer;

        font-size: 14px;
    }

    .nav-btn:hover {
        background: rgba(139,92,246,0.15);
        color: white;
    }


    /* ==============================
       MAIN CONTENT
    ============================== */

    .main-content {
        width: 90%;
        max-width: 1200px;

        margin: 0 auto;

        padding-top: 35px;
    }

    .welcome {
        margin-bottom: 25px;
    }

    .welcome h2 {
        font-family: Georgia, 'Times New Roman', Times, serif;
        margin-bottom: 5px;
    }

    .welcome p {
        font-family: cursive;
        color: #999;
    }


    /* ==============================
       SEARCH
    ============================== */

    .search-box {
        display: flex;
        gap: 10px;

        margin-bottom: 30px;
    }

    .search-box input {
        flex: 1;

        padding: 14px 16px;

        border-radius: 12px;

        border: 1px solid rgba(255,255,255,0.1);

        background: rgba(255,255,255,0.05);

        color: white;

        outline: none;
    }

    .search-box input:focus {
        border-color: #8b5cf6;
    }

    .search-box button {
        border: none;

        padding: 0 22px;

        border-radius: 12px;

        background: #8b5cf6;

        color: white;

        cursor: pointer;
    }


    /* ==============================
       SECTION
    ============================== */

    .section {
        margin-bottom: 35px;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 15px;
    }

    .section-header h3 {
        margin: 0;
    }


    /* ==============================
       SONG LIST
    ============================== */

    .song-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .song-card {
        display: flex;
        align-items: center;
        gap: 15px;

        padding: 14px;

        border-radius: 14px;

        background: rgba(255,255,255,0.04);

        border: 1px solid rgba(255,255,255,0.06);

        transition: 0.2s;
    }

    .song-card:hover {
        background: rgba(139,92,246,0.10);
        transform: translateY(-1px);
    }

    .song-cover {
        width: 55px;
        height: 55px;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #8b5cf6,
            #312e81
        );

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 22px;

        flex-shrink: 0;
    }

    .song-info {
        flex: 1;
        min-width: 0;
    }

    .song-title {
        font-weight: 600;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .song-artist {
        color: #999;
        font-size: 13px;

        margin-top: 4px;
    }

    .song-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .song-action-btn {
        width: 38px;
        height: 38px;

        border-radius: 50%;

        border: none;

        background: rgba(255,255,255,0.08);

        color: white;

        cursor: pointer;

        font-size: 16px;
    }

    .song-action-btn:hover {
        background: #8b5cf6;
    }

    .song-action-btn.liked {
        color: #c084fc;
    }


    /* ==============================
       PLAYLISTS
    ============================== */

    .playlist-list {
        display: grid;

        grid-template-columns:
            repeat(auto-fill, minmax(180px, 1fr));

        gap: 15px;
    }

    .playlist-card {
        padding: 20px;

        border-radius: 15px;

        background: rgba(255,255,255,0.04);

        border: 1px solid rgba(255,255,255,0.06);

        cursor: pointer;
    }

    .playlist-card:hover {
        border-color: #8b5cf6;
    }

    .playlist-icon {
        font-size: 30px;

        margin-bottom: 12px;
    }

    .playlist-name {
        font-weight: 600;
    }

    .playlist-count {
        color: #888;

        font-size: 13px;

        margin-top: 5px;
    }


    /* ==============================
       AUDIO PLAYER
    ============================== */

    .player {
        position: fixed;

        bottom: 0;
        left: 0;
        right: 0;

        min-height: 85px;

        background: rgba(12,12,20,0.96);

        border-top:
            1px solid rgba(255,255,255,0.08);

        backdrop-filter: blur(15px);

        z-index: 200;

        display: flex;

        align-items: center;

        gap: 20px;

        padding: 12px 4%;
    }

    .current-song {
        width: 220px;
        min-width: 160px;
    }

    .current-title {
        font-weight: 600;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .current-artist {
        color: #888;

        font-size: 12px;

        margin-top: 3px;
    }

    .player-center {
        flex: 1;

        display: flex;
        flex-direction: column;

        align-items: center;

        gap: 8px;
    }

    .player-controls {
        display: flex;
        align-items: center;

        gap: 12px;
    }

    .control-btn {
        border: none;

        background: transparent;

        color: white;

        cursor: pointer;

        font-size: 18px;
    }

    .play-btn {
        width: 38px;
        height: 38px;

        border-radius: 50%;

        background: #8b5cf6;

        color: white;

        border: none;

        cursor: pointer;
    }

    .progress-container {
        width: 100%;

        display: flex;
        align-items: center;

        gap: 8px;
    }

    .progress-container span {
        color: #888;
        font-size: 11px;

        min-width: 35px;
    }

    #seekBar {
        flex: 1;
    }

    .volume-container {
        display: flex;
        align-items: center;

        gap: 8px;

        width: 120px;
    }

    #volumeBar {
        width: 80px;
    }


    /* ==============================
       EMPTY / ERROR
    ============================== */

    .empty-message {
        padding: 30px;

        text-align: center;

        color: #777;

        border: 1px dashed
            rgba(255,255,255,0.1);

        border-radius: 14px;
    }

    .control-btn.liked {
    color: #c084fc;
}

    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 700px) {

        .navbar {
            padding: 0 4%;
        }

        .nav-btn {
            padding: 8px;
        }

        .main-content {
            width: 92%;
        }

        .player {
            gap: 10px;
            padding: 10px;
        }

        .current-song {
            display: none;
        }

        .volume-container {
            width: 90px;
        }

        #volumeBar {
            width: 60px;
        }

    }

</style>

</head>

<body>

<div class="dashboard">
<!-- ==============================
     NAVBAR
============================== -->

<nav class="navbar">

    <div class="nav-logo">

        <span>♪</span>

        Melodia

    </div>


    <div class="nav-actions">

        <button
            class="nav-btn"
            id="profileButton">

            Profile

        </button>

        <button
            class="nav-btn"
            id="logoutButton">

            Logout

        </button>

    </div>

</nav>


<!-- ==============================
     MAIN
============================== -->

<main class="main-content">


    <div class="welcome">

        <h2>Good to see you</h2>

        <p>
            Find something you love listening to.
        </p>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search songs...">

        <button id="searchButton">
            Search
        </button>

    </div>


    <!-- SONGS -->

    <section class="section">

        <div class="section-header">

            <h3>All Songs</h3>

        </div>

        <div
            class="song-list"
            id="songList">

            <div class="empty-message">
                Loading songs...
            </div>

        </div>

    </section>


    <!-- PLAYLISTS -->

    <section class="section">

        <div class="section-header">

            <h3>Your Playlists</h3>

            <button
                class="nav-btn"
                id="createPlaylistButton">

                + Create Playlist

            </button>

        </div>


        <div
            class="playlist-list"
            id="playlistList">

            <div class="empty-message">
                Loading playlists...
            </div>

        </div>

    </section>


</main>


<!-- ==============================
     AUDIO PLAYER
============================== -->

<div class="player">


    <div class="current-song">

        <div
            class="current-title"
            id="currentTitle">

            No song selected

        </div>

        <div
            class="current-artist"
            id="currentArtist">

            --

        </div>

    </div>


    <div class="player-center">


        <div class="player-controls">

            <button
                class="control-btn"
                id="previousButton">

                ⏮

            </button>


            <button
                class="play-btn"
                id="playPauseButton">

                ▶

            </button>


            <button
                class="control-btn"
                id="nextButton">

                ⏭

            </button>
            <button class="control-btn" id="nextButton">⏭</button>

<button class="control-btn" id="playerLikeButton" hidden>♡</button>

        </div>


        <div class="progress-container">

            <span id="currentTime">
                0:00
            </span>

            <input
                type="range"
                id="seekBar"
                min="0"
                max="100"
                value="0">

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="volume-container">

        <span>🔊</span>

        <input
            type="range"
            id="volumeBar"
            min="0"
            max="1"
            step="0.01"
            value="1">

    </div>


</div>

</div>

<!-- REAL HTML AUDIO ELEMENT -->

<audio id="audioPlayer"></audio>

<script src="listener.js"></script>

</body>

</html>
