<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Melodia - Registration</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="login-container">

    <div class="login-card">

        <div class="logo">
            ♪
        </div>

        <h1>Melodia</h1>

        <p class="tagline">
            Where music finds its voice.
        </p>

        <h2>Create Account</h2>

        <p class="login-text">
            Choose your account type
        </p>

        <!-- ROLE SELECTION -->
        <div class="role-container">

    <button
        type="button"
        class="role-btn active"
        data-role="ARTIST">
        Artist
    </button>

    <button
        type="button"
        class="role-btn"
        data-role="USER">
        Listener
    </button>

</div>

        <!-- REGISTRATION FORM -->
        <form id="registerForm">
            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>


            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>
            </div>


            <div class="input-group">
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>
            </div>


            <label class="remember">
                <input
                    type="checkbox"
                    id="terms"
                    required>

                I agree to the Terms & Conditions
            </label>


            <button
                type="submit"
                class="login-btn"
                id="registerButton">

                Create Account

            </button>

        </form>


        <p id="message"></p>


        <!-- BACK TO LOGIN -->
        <p class="signup-text">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>

    </div>

</div>

<script src="config.js"></script>
<script src="register.js"></script>
</body>

</html>
